services:
  - type: web
    name: cartpilot-ai
    env: node
    plan: free
    buildCommand: npm install && npm run seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: SIMULATE_PAYPAL
        value: "true"
      - key: SELLER_USERNAME
        value: admin
      - key: SELLER_PASSWORD
        value: cartpilot
